<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Selection Feature Page</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <h1>Feature Selection</h1>
    <div class="feature-card-container">
        <label class="feature-card" for="cloud">
            <input type="checkbox" id="cloud" name="cloud"/>
            <h2>Cloud Storage</h2>
            <p>100gb of storage in cloud</p>
        </label>
        <label class="feature-card" for="api"> 
            <input type="checkbox" name="api" id="api"/>  
            <h2>API access</h2>
            <p>Integrate with your custom build tools</p> 
        </label>
    </div>
</body>

</html>
